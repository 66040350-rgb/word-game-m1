<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Grand Prix Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;0,900;1,700&family=Kanit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --primary: #0284c7;
      --accent: #f97316;
      --gold: #facc15;
      --success: #10b981;
      --danger: #ef4444;
      --glass: rgba(255, 255, 255, 0.92);
    }
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #38bdf8; position: fixed; inset: 0;
      font-family: 'Kanit', sans-serif;
    }
    #three-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD */
    #top-hud {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--glass); backdrop-filter: blur(14px);
      border: 2px solid rgba(2, 132, 199, 0.3); border-radius: 999px;
      padding: 6px 24px; display: flex; align-items: center; gap: 20px;
      color: #0f172a; z-index: 45; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .hud-chip { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 700; }
    .hud-pill {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff; padding: 3px 14px; border-radius: 999px; font-weight: 800; font-family: 'Chakra Petch';
    }

    /* Minimap Radar */
    #minimap-card {
      position: fixed; top: 16px; right: 16px; width: 150px; height: 150px;
      background: rgba(255, 255, 255, 0.95); border: 3px solid #0284c7;
      border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 50;
    }
    #minimapCanvas { width: 100%; height: 100%; display: block; }
    .map-tag {
      position: absolute; bottom: 6px; left: 8px; font-size: 0.65rem;
      font-weight: 900; color: #0284c7; font-family: 'Chakra Petch';
    }

    /* Speedometer */
    #speedometer-box {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 50; pointer-events: none;
    }
    .speed-dial {
      background: var(--glass); backdrop-filter: blur(14px);
      border: 2px solid #bae6fd; border-radius: 22px; padding: 6px 26px;
      display: flex; align-items: baseline; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .speed-num { font-size: 2.8rem; font-weight: 900; color: #0284c7; font-family: 'Chakra Petch'; font-style: italic; }
    .speed-unit { font-size: 0.85rem; font-weight: 800; color: #64748b; }
    .gear-mode { font-size: 1.1rem; color: var(--accent); font-weight: 900; font-family: 'Chakra Petch'; margin-left: 6px; }

    /* Mobile Controls */
    #mobile-controls {
      position: fixed; bottom: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 32px; pointer-events: none; z-index: 60;
    }
    .pad-cluster { pointer-events: auto; display: flex; gap: 14px; align-items: center; }
    .v-btn {
      width: 76px; height: 76px; border-radius: 22px; background: rgba(255, 255, 255, 0.92);
      border: 2px solid #e0f2fe; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08); cursor: pointer; transition: 0.08s;
    }
    .v-btn:active { transform: scale(0.92); background: #e0f2fe; border-color: #0284c7; }
    .v-btn svg { width: 34px; height: 34px; fill: #0284c7; }

    #audio-toggle {
      position: fixed; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 14px;
      background: var(--glass); border: 2px solid #bae6fd; display: flex;
      justify-content: center; align-items: center; cursor: pointer; z-index: 50;
    }
    #audio-toggle svg { width: 22px; height: 22px; fill: #0284c7; }

    /* Grand Prix Modals */
    .overlay-screen {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(14px); display: flex; justify-content: center; align-items: center;
      padding: 20px; z-index: 100;
    }
    .modal-card {
      background: #ffffff; border: 3px solid #ffffff; border-radius: 32px;
      padding: 36px 30px; max-width: 500px; width: 100%; text-align: center;
      box-shadow: 0 25px 60px rgba(2, 132, 199, 0.25); animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .brand-badge {
      display: inline-flex; align-items: center; gap: 8px; background: #e0f2fe; color: #0284c7;
      border: 1.5px solid #bae6fd; padding: 5px 14px; border-radius: 999px; font-size: 0.75rem;
      font-weight: 800; font-family: 'Chakra Petch'; margin-bottom: 12px;
    }
    .game-h1 {
      font-size: 2.8rem; font-weight: 900; font-style: italic; font-family: 'Chakra Petch';
      background: linear-gradient(135deg, #0284c7 20%, #f97316 90%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
    }
    .feature-strip { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
    .f-pill {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px;
      padding: 6px 12px; font-size: 0.82rem; font-weight: 700; color: #334155;
    }
    .input-box {
      width: 100%; padding: 15px 18px; border-radius: 16px; border: 2px solid #cbd5e1;
      background: #f8fafc; color: #0f172a; font-size: 1.05rem; outline: none; font-family: 'Kanit';
      font-weight: 600; margin: 16px 0; text-align: center;
      user-select: text !important; -webkit-user-select: text !important; pointer-events: auto !important;
    }
    .input-box:focus { border-color: #0284c7; background: #fff; }
    .rbx-green-btn {
      width: 100%; padding: 16px; border-radius: 18px; border: none;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #fff; font-size: 1.15rem; font-weight: 800; font-family: 'Kanit'; cursor: pointer;
      box-shadow: 0 6px 0 #047857; display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .rbx-green-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #047857; }

    /* Checkpoint Modal */
    #checkpoint-modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center;
      padding: 16px; z-index: 120;
    }
    .cp-box {
      background: #ffffff; border: 3px solid #0284c7; border-radius: 26px;
      padding: 26px; max-width: 580px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }
    .minigame-stage {
      background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 18px;
      padding: 22px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 140px; gap: 14px; margin: 16px 0;
    }
    .key-badge-btn {
      background: #ffffff; border: 3px solid #0284c7; border-radius: 16px;
      padding: 14px 34px; font-family: 'Chakra Petch'; font-weight: 800;
      font-size: 1.6rem; color: #0284c7; box-shadow: 0 6px 0 #bae6fd; cursor: pointer;
    }
    .ribbon-btn {
      padding: 12px 18px; border-radius: 12px; border: 2px solid #cbd5e1;
      background: #ffffff; font-family: 'Kanit'; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="three-container"></div>

  <div id="audio-toggle" onclick="toggleAudio()" title="เปิด/ปิดเสียง">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </div>

  <div id="top-hud">
    <div class="hud-chip">
      <span id="hud-name" style="font-weight:900; color:var(--primary);">-</span>
    </div>
    <div class="hud-chip">
      <span class="hud-pill" id="hud-stage">ด่าน 1 / 12</span>
    </div>
    <div class="hud-chip">
      <span class="hud-pill" style="background: linear-gradient(135deg, #10b981, #059669);" id="hud-score">0 / 20</span>
    </div>
  </div>

  <div id="minimap-card">
    <canvas id="minimapCanvas" width="150" height="150"></canvas>
    <div class="map-tag">GPS RADAR</div>
  </div>

  <div id="speedometer-box">
    <div class="speed-dial">
      <span class="speed-num" id="speed-val">0</span>
      <span class="speed-unit">MPH</span>
      <span class="gear-mode" id="gear-val">N</span>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="pad-cluster">
      <div class="v-btn" id="btn-left"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>
      <div class="v-btn" id="btn-right"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
    </div>
    <div class="pad-cluster">
      <div class="v-btn" id="btn-down"><svg viewBox="0 0 24 24" style="fill:#ef4444;"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></div>
      <div class="v-btn" id="btn-up" style="width: 84px; height: 84px;"><svg viewBox="0 0 24 24" style="fill:#10b981;"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="overlay-screen">
    <div class="modal-card">
      <div class="brand-badge">MICROSOFT WORD ARENA 3D</div>
      <div class="game-h1">WORD ROAD 3D</div>
      <p style="color: #64748b; font-size: 0.95rem;">ขับรถผจญภัยทบทวนเนื้อหา Word ม.1 (E1)</p>
      
      <div class="feature-strip">
        <div class="f-pill">12 ด่านท้าทาย</div>
        <div class="f-pill">คะแนนเต็ม 20</div>
        <div class="f-pill">Nitro & Hazards</div>
      </div>

      <input type="text" id="player-input" class="input-box" placeholder="กรอกชื่อ-นามสกุล หรือเลขที่..." />
      <button class="rbx-green-btn" onclick="startGame()">
        <span>ออกสตาร์ท (START ENGINE)</span>
      </button>
    </div>
  </div>

  <!-- Checkpoint Modal -->
  <div id="checkpoint-modal">
    <div class="cp-box">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
        <span id="cp-badge" style="font-weight:900; color:#0284c7;">CHECKPOINT 1</span>
        <span id="cp-pts" style="font-weight:900; color:#f97316;">+1.5 คะแนน</span>
      </div>
      <div id="cp-q" style="font-size:1.15rem; font-weight:700; margin-bottom:12px;">คำถาม...</div>
      <div class="minigame-stage" id="cp-minigame-area"></div>
    </div>
  </div>

  <script>
    const missions = [
      { id: 1, pts: 1.5, mode: "ribbon", q: "ภารกิจ: เลือกแท็บ Ribbon ที่ใช้เปลี่ยนแบบฟอนต์และขนาดตัวอักษร:", target: "Home" },
      { id: 2, pts: 1.5, mode: "shortcut", q: "ภารกิจ: กดคีย์ลัดเพื่อ 'บันทึกเอกสาร (Save)':", keyReq: "s", codeReq: "KeyS", displayKey: "Ctrl + S" },
      { id: 3, pts: 1.5, mode: "shortcut", q: "ภารกิจ: กดคีย์ลัดเพื่อ 'ยกเลิกคำสั่งล่าสุด (Undo)':", keyReq: "z", codeReq: "KeyZ", displayKey: "Ctrl + Z" },
      { id: 4, pts: 1.5, mode: "shortcut", q: "ภารกิจ: กดคีย์ลัดเพื่อทำข้อความ 'ตัวหนา (Bold)':", keyReq: "b", codeReq: "KeyB", displayKey: "Ctrl + B" },
      { id: 5, pts: 1.5, mode: "align", q: "ภารกิจ: กดจัดข้อความให้อยู่ 'กึ่งกลางหน้ากระดาษ':", target: "center" },
      { id: 6, pts: 1.5, mode: "choice", q: "ภารกิจ: เครื่องมือใดใช้สร้างรายการแบบมีลำดับ 1, 2, 3 ชัดเจน:", target: "Numbering", opts: ["Bullets", "Numbering (ลำดับเลข)", "Multilevel List"] },
      { id: 7, pts: 1.5, mode: "choice", q: "ภารกิจ: การตัดข้อความแบบใดทำให้ข้อความล้อมรอบกรอบรูปภาพเป็นสี่เหลี่ยม:", target: "Square", opts: ["In Line with Text", "Square (จัตุรัส)", "Behind Text"] },
      { id: 8, pts: 1.5, mode: "choice", q: "ภารกิจ: ตารางขนาด 3 x 2 หมายถึงข้อใด:", target: "3 คอลัมน์ x 2 แถว", opts: ["3 แถว x 2 คอลัมน์", "3 คอลัมน์ x 2 แถว", "6 แถว x 1 คอลัมน์"] },
      { id: 9, pts: 2.0, mode: "choice", q: "ภารกิจ: เอกสารที่มีตารางแนวกว้าง ควรตั้งค่าหน้ากระดาษแบบใด:", target: "Landscape", opts: ["Portrait (แนวตั้ง)", "Landscape (แนวนอน)", "Columns"] },
      { id: 10, pts: 2.0, mode: "choice", q: "ภารกิจ: ใน Word เส้นใต้หยักสีแดงใต้ข้อความหมายถึงสิ่งใด:", target: "สะกดคำผิด", opts: ["สะกดคำผิด", "ไวยากรณ์ผิด", "เว้นวรรคผิด"] },
      { id: 11, pts: 2.0, mode: "choice", q: "ภารกิจ: การสร้างสารบัญอัตโนมัติ ต้องกำหนดสไตล์ใดให้หัวข้อหลัก:", target: "Heading 1", opts: ["Title", "Heading 1", "Normal"] },
      { id: 12, pts: 2.0, mode: "choice", q: "ภารกิจ: การบันทึกส่งออกไฟล์ชนิดใดที่รักษารูปแบบหน้ากระดาษได้สมบูรณ์ที่สุด:", target: ".pdf", opts: [".docx", ".txt", ".pdf"] }
    ];

    // Audio Engine: ท่อไอเสียเสียงทุ้มนุ่ม
    let audioCtx = null, isMuted = false, engineOsc = null, subOsc = null, engineFilter = null, engineGain = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator(); engineOsc.type = "triangle";
        subOsc = audioCtx.createOscillator(); subOsc.type = "sine";
        engineFilter = audioCtx.createBiquadFilter(); engineFilter.type = "lowpass";
        engineFilter.frequency.setValueAtTime(140, audioCtx.currentTime);
        engineGain = audioCtx.createGain(); engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

        engineOsc.connect(engineFilter); subOsc.connect(engineFilter);
        engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
        engineOsc.start(); subOsc.start();
      }
    }

    function updateAudio(speed) {
      if (!audioCtx || isMuted || !engineOsc) return;
      const s = Math.abs(speed);
      engineOsc.frequency.setTargetAtTime(30 + s * 45, audioCtx.currentTime, 0.08);
      subOsc.frequency.setTargetAtTime(15 + s * 22, audioCtx.currentTime, 0.08);
      engineFilter.frequency.setTargetAtTime(140 + s * 160, audioCtx.currentTime, 0.08);
    }

    function toggleAudio() {
      isMuted = !isMuted;
      if (engineGain) engineGain.gain.setValueAtTime(isMuted ? 0 : 0.04, audioCtx.currentTime);
    }

    let scene, camera, renderer;
    let carGroup, checkpoints = [], hazards = [], speedPads = [];
    let playerName = "Player", score = 0, currentStage = 0, isModalOpen = false;
    let keys = { up: false, down: false, left: false, right: false };

    let car = {
      x: 0, z: 0, angle: 0, speed: 0,
      maxSpeed: 1.5, accel: 0.04, friction: 0.016, turnSpeed: 0.048,
      spinTimer: 0, boostTimer: 0
    };

    const waypoints = Array.from({ length: 12 }, (_, i) => ({ z: -180 - i * 220, stage: i + 1 }));

    function startGame() {
      const val = document.getElementById("player-input").value.trim();
      playerName = val ? val : "นักขับ ม.1 Grand Prix";
      document.getElementById("hud-name").innerText = playerName;
      document.getElementById("start-screen").style.display = "none";
      initAudio();
      init3D();
      setupControls();
      loop();
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7dd3fc); // ฟ้าสว่างสดใส
      // แก้บั๊กหมอกกินพื้นที่: ดันระยะหมอกออกไปไกลมาก (250 ถึง 1200) ทำให้เห็นฉากคมชัดทุกระยะ
      scene.fog = new THREE.Fog(0xbae6fd, 250, 1200);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.getElementById("three-container").appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Lighting แดดกลางวัน
      const hemi = new THREE.HemisphereLight(0xffffff, 0x86efac, 0.9);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfffbeb, 1.2);
      sun.position.set(80, 160, 60);
      sun.castShadow = true;
      scene.add(sun);

      buildWorldEnvironment();
      buildSportsCar();
      buildGates();
      buildHazardsAndPowerups();
    }

    function buildWorldEnvironment() {
      // 1. ผืนหญ้ากว้าง
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1200, 3200),
        new THREE.MeshLambertMaterial({ color: 0x4ade80 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.z = -1400;
      scene.add(ground);

      // 2. ถนนลาดยางกว้าง 32 เมตร ลวดลายชัดเจน
      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(32, 3000),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 })
      );
      road.rotation.x = -Math.PI / 2;
      road.position.set(0, 0.05, -1400);
      road.receiveShadow = true;
      scene.add(road);

      // ขอบทางสีแดง-ขาวสลับลายแบบสนามแข่ง Grand Prix
      const curbL = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 3000), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
      curbL.position.set(-16.8, 0.2, -1400);
      scene.add(curbL);

      const curbR = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 3000), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
      curbR.position.set(16.8, 0.2, -1400);
      scene.add(curbR);

      // 3. ภูเขา Low-poly ด้านหลัง ปิดช่องว่างสีขาว
      for (let z = 100; z > -3000; z -= 140) {
        [-110, 110].forEach(x => {
          const mHeight = 80 + Math.random() * 60;
          const mountain = new THREE.Mesh(
            new THREE.ConeGeometry(55 + Math.random() * 25, mHeight, 5),
            new THREE.MeshLambertMaterial({ color: 0x38bdf8, flatShading: true })
          );
          mountain.position.set(x + (Math.random() - 0.5) * 40, mHeight / 2, z);
          scene.add(mountain);
        });
      }

      // 4. ต้นไม้และป้ายโฆษณาข้างทาง
      for (let z = 50; z > -2800; z -= 35) {
        [-24, 24].forEach(x => {
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 6), new THREE.MeshLambertMaterial({ color: 0x854d0e }));
          trunk.position.set(x, 3, z);
          scene.add(trunk);

          const leaves = new THREE.Mesh(new THREE.ConeGeometry(4, 9, 7), new THREE.MeshLambertMaterial({ color: 0x16a34a, flatShading: true }));
          leaves.position.set(x, 8.5, z);
          scene.add(leaves);
        });
      }
    }

    function buildSportsCar() {
      carGroup = new THREE.Group();

      // บอดี้รถสีส้มสปอร์ต ชัดเจน ตัดกับพื้นถนน
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(3.6, 1.1, 7.2),
        new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.2, metalness: 0.4 })
      );
      body.position.y = 0.9;
      body.castShadow = true;
      carGroup.add(body);

      // ห้องโดยสารกระจกดำเงา
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(2.8, 0.95, 3.6),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.8 })
      );
      cabin.position.set(0, 1.75, -0.3);
      carGroup.add(cabin);

      // สปอยเลอร์หลัง Racing Wing
      const wing = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.15, 0.9), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
      wing.position.set(0, 2.0, 3.0);
      carGroup.add(wing);

      // ล้อรถ
      const wGeo = new THREE.CylinderGeometry(0.75, 0.75, 0.65, 16);
      const wMat = new THREE.MeshLambertMaterial({ color: 0x111827 });
      [[-1.85, 0.75, 2.2], [1.85, 0.75, 2.2], [-1.85, 0.75, -2.2], [1.85, 0.75, -2.2]].forEach(pos => {
        const w = new THREE.Mesh(wGeo, wMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(...pos);
        carGroup.add(w);
      });

      scene.add(carGroup);
    }

    function buildGates() {
      waypoints.forEach((wp, idx) => {
        const gate = new THREE.Group();
        gate.position.set(0, 0, wp.z);

        // ซุ้มเหล็กสีน้ำเงิน Grand Prix
        const pylonL = new THREE.Mesh(new THREE.BoxGeometry(2.2, 16, 2.2), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
        pL = pylonL.clone(); pL.position.set(-16, 8, 0); gate.add(pL);
        const pR = pylonL.clone(); pR.position.set(16, 8, 0); gate.add(pR);

        const banner = new THREE.Mesh(new THREE.BoxGeometry(34, 3.5, 1.8), new THREE.MeshLambertMaterial({ color: 0x0369a1 }));
        banner.position.set(0, 14.5, 0);
        gate.add(banner);

        // ม่านเลเซอร์ปลดล็อก
        const laser = new THREE.Mesh(
          new THREE.PlaneGeometry(30, 13),
          new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
        );
        laser.position.set(0, 6.5, 0);
        gate.add(laser);

        scene.add(gate);
        checkpoints.push({ gate, laser, z: wp.z, passed: false });
      });
    }

    function buildHazardsAndPowerups() {
      for (let z = -60; z > -2700; z -= 38) {
        if (waypoints.some(wp => Math.abs(wp.z - z) < 20)) continue;
        const laneX = (Math.random() - 0.5) * 22;
        const rand = Math.random();

        if (rand < 0.35) {
          // 1. คราบน้ำมันลื่น (Oil Slick Hazard): เหยียบแล้วรถหมุนติ้ว
          const oil = new THREE.Mesh(
            new THREE.CylinderGeometry(2.2, 2.5, 0.08, 12),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9 })
          );
          oil.position.set(laneX, 0.08, z);
          scene.add(oil);
          hazards.push({ x: laneX, z: z, radius: 2.2, type: 'oil' });
        } else if (rand < 0.65) {
          // 2. แบริเออร์ขาวแดงเคลื่อนที่ซ้าย-ขวา บังเลน
          const bar = new THREE.Mesh(
            new THREE.BoxGeometry(4.5, 1.5, 1.2),
            new THREE.MeshLambertMaterial({ color: 0xef4444 })
          );
          bar.position.set(laneX, 0.75, z);
          scene.add(bar);
          hazards.push({ mesh: bar, x: laneX, z: z, radius: 2.5, type: 'moving_bar', baseLane: laneX, speed: (Math.random() - 0.5) * 0.12 });
        } else {
          // 3. แผ่นสปีดบูสต์ไนโตร (Nitro Dash Pad)
          const pad = new THREE.Mesh(
            new THREE.PlaneGeometry(4, 8),
            new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide })
          );
          pad.rotation.x = -Math.PI / 2;
          pad.position.set(laneX, 0.09, z);
          scene.add(pad);
          speedPads.push({ x: laneX, z: z, radius: 2.5 });
        }
      }
    }

    function setupControls() {
      window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = true;
        if (k === "arrowdown" || k === "s") keys.down = true;
        if (k === "arrowleft" || k === "a") keys.left = true;
        if (k === "arrowright" || k === "d") keys.right = true;
      });
      window.addEventListener("keyup", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = false;
        if (k === "arrowdown" || k === "s") keys.down = false;
        if (k === "arrowleft" || k === "a") keys.left = false;
        if (k === "arrowright" || k === "d") keys.right = false;
      });

      const bind = (id, act) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", e => { e.preventDefault(); keys[act] = true; });
        el.addEventListener("touchend", () => keys[act] = false);
      };
      bind("btn-up", "up"); bind("btn-down", "down");
      bind("btn-left", "left"); bind("btn-right", "right");
    }

    function updateGamePhysics() {
      if (isModalOpen) return;

      // ไดนามิกของสิ่งกีดขวางที่เคลื่อนที่ขวางเลน
      hazards.forEach(h => {
        if (h.type === 'moving_bar') {
          h.x += h.speed;
          if (h.x > 12 || h.x < -12) h.speed *= -1;
          h.mesh.position.x = h.x;
        }
      });

      // จัดการสถานะ Boost หรือ Spin
      if (car.spinTimer > 0) {
        car.spinTimer--;
        car.angle += 0.28;
        car.speed *= 0.94;
      } else {
        const currentMax = car.boostTimer > 0 ? 2.4 : car.maxSpeed;
        if (car.boostTimer > 0) car.boostTimer--;

        if (keys.up) car.speed += car.accel;
        else if (keys.down) car.speed -= car.accel * 1.5;
        else car.speed = car.speed > 0 ? Math.max(0, car.speed - car.friction) : Math.min(0, car.speed + car.friction);

        car.speed = Math.max(-0.6, Math.min(car.speed, currentMax));

        if (car.speed !== 0) {
          const dir = car.speed > 0 ? 1 : -1;
          if (keys.left) car.angle += car.turnSpeed * dir;
          if (keys.right) car.angle -= car.turnSpeed * dir;
        }
      }

      updateAudio(car.speed / car.maxSpeed);

      const nX = car.x - Math.sin(car.angle) * car.speed;
      const nZ = car.z - Math.cos(car.angle) * car.speed;
      car.x = Math.max(-14, Math.min(14, nX));

      // ตรวจสอบการชนคราบน้ำมันและแบริเออร์
      hazards.forEach(h => {
        if (Math.hypot(car.x - h.x, car.z - h.z) < h.radius + 1.6) {
          car.spinTimer = 35; // รถหมุน
          car.speed *= 0.4;
        }
      });

      // ตรวจสอบการเหยียบแผ่นไนโตรสปีดบูสต์
      speedPads.forEach(p => {
        if (Math.hypot(car.x - p.x, car.z - p.z) < p.radius + 1.2) {
          car.boostTimer = 45;
          car.speed = 2.4; // พุ่งไปข้างหน้าทันที
        }
      });

      // ด่านสกัดเลเซอร์
      let blocked = false;
      checkpoints.forEach((cp, idx) => {
        if (!cp.passed && car.z > cp.z && nZ <= cp.z + 1.5) {
          blocked = true;
          car.speed = 0;
          openCheckpointModal(idx);
        }
      });

      if (!blocked) car.z = nZ;

      carGroup.position.set(car.x, 0, car.z);
      carGroup.rotation.y = car.angle;

      // กล้องไดนามิกไล่ตามหลัง
      const camOffset = new THREE.Vector3(0, 5.2, 12.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.angle);
      camera.position.lerp(new THREE.Vector3(car.x + camOffset.x, 5.2, car.z + camOffset.z), 0.2);
      camera.lookAt(new THREE.Vector3(car.x - Math.sin(car.angle) * 10, 2.0, car.z - Math.cos(car.angle) * 10));

      const mph = Math.round(Math.abs(car.speed) * 65);
      document.getElementById("speed-val").innerText = mph;
      document.getElementById("gear-val").innerText = car.speed > 0.05 ? 'D' : (car.speed < -0.05 ? 'R' : 'N');

      renderRadar();
    }

    let activeStage = 0;
    function openCheckpointModal(idx) {
      isModalOpen = true;
      activeStage = idx;
      const m = missions[idx];

      document.getElementById("cp-badge").innerText = `CHECKPOINT ${idx + 1}`;
      document.getElementById("cp-pts").innerText = `+${m.pts} คะแนน`;
      document.getElementById("cp-q").innerText = m.q;

      const area = document.getElementById("cp-minigame-area");
      area.innerHTML = "";

      if (m.mode === "shortcut") {
        area.innerHTML = `
          <button class="key-badge-btn" onclick="submitPass(${idx})">${m.displayKey}</button>
        `;
      } else if (m.mode === "ribbon") {
        ["หน้าแรก (Home)", "แทรก (Insert)", "เค้าโครง (Layout)"].forEach(t => {
          const btn = document.createElement("button");
          btn.className = "ribbon-btn"; btn.innerText = t;
          btn.onclick = () => t.includes(m.target) ? submitPass(idx) : submitFail(idx);
          area.appendChild(btn);
        });
      } else if (m.mode === "align") {
        ["ชิดซ้าย", "กึ่งกลาง", "ชิดขวา"].forEach(t => {
          const btn = document.createElement("button");
          btn.className = "ribbon-btn"; btn.innerText = t;
          btn.onclick = () => t === "กึ่งกลาง" ? submitPass(idx) : submitFail(idx);
          area.appendChild(btn);
        });
      } else {
        m.opts.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "ribbon-btn"; btn.innerText = opt;
          btn.onclick = () => opt.includes(m.target) ? submitPass(idx) : submitFail(idx);
          area.appendChild(btn);
        });
      }

      document.getElementById("checkpoint-modal").style.display = "flex";
    }

    function submitPass(idx) {
      score += missions[idx].pts;
      checkpoints[idx].passed = true;
      checkpoints[idx].laser.material.color.setHex(0x10b981);
      checkpoints[idx].laser.material.opacity = 0.12;

      currentStage = idx + 1;
      document.getElementById("hud-stage").innerText = `ด่าน ${Math.min(currentStage + 1, 12)} / 12`;
      document.getElementById("hud-score").innerText = `${Number(score.toFixed(1))} / 20`;
      document.getElementById("checkpoint-modal").style.display = "none";
      isModalOpen = false;
      car.z -= 4.0;
    }

    function submitFail(idx) {
      alert("คำตอบยังไม่ถูกต้อง ลองศึกษาทบทวนอีกครั้ง!");
    }

    function renderRadar() {
      const cvs = document.getElementById("minimapCanvas");
      const ctx = cvs.getContext("2d");
      const w = cvs.width, h = cvs.height;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = "#86efac"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#475569"; ctx.fillRect(w / 2 - 18, 0, 36, h);

      waypoints.forEach((wp, i) => {
        const my = h / 2 + ((wp.z - car.z) / 380) * (h / 2);
        if (my >= 0 && my <= h) {
          ctx.beginPath(); ctx.arc(w / 2, my, 6, 0, Math.PI * 2);
          ctx.fillStyle = checkpoints[i].passed ? "#10b981" : "#0284c7"; ctx.fill();
        }
      });

      ctx.save();
      ctx.translate(w / 2 + (car.x / 14) * 16, h / 2);
      ctx.rotate(-car.angle);
      ctx.fillStyle = "#f97316";
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(5, 6); ctx.lineTo(-5, 6); ctx.fill();
      ctx.restore();
    }

    function loop() {
      requestAnimationFrame(loop);
      updateGamePhysics();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
